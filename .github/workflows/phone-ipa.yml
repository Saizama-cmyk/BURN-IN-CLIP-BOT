# Builds BURN-IN Remote as an unsigned .ipa on a free GitHub macOS runner.
#
# Apple's toolchain only runs on macOS, so this is how the app gets built without owning a Mac.
# The .ipa is unsigned on purpose: AltStore / SideStore signs it with your own Apple ID when you
# install it, which is what makes sideloading work without a paid developer account.
#
# Run it from the repo's Actions tab ("Run workflow"), then download the artifact.
name: Phone app (.ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - "phone/**"
      - ".github/workflows/phone-ipa.yml"

permissions:
  contents: write          # publish the .ipa as a release and commit the AltStore source

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: pod install
        working-directory: phone/ios

      - name: Build without code signing
        working-directory: phone/ios
        run: |
          SCHEME=$(ls -d *.xcodeproj | head -1 | sed 's/\.xcodeproj$//')
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "Building scheme $SCHEME in $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Wrap the app into an .ipa
        working-directory: phone/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app was produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BURN-IN-Remote.ipa Payload
          ls -lh BURN-IN-Remote.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BURN-IN-Remote-ipa
          path: phone/ios/BURN-IN-Remote.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish it as a release so AltStore can update the phone
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: phone/ios
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('../app.json'))['expo']['version'])")
          BUILD=$GITHUB_RUN_NUMBER
          NOTES="Unsigned on purpose: your sideloader signs it with your own Apple ID. Works with AltStore, SideStore, Feather, Sideloadly, ESign and TrollStore."
          TAG="phone-v$VERSION.$BUILD"
          for T in "$TAG" "phone-latest"; do
            gh release delete "$T" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$T" BURN-IN-Remote.ipa --title "BURN-IN Remote $VERSION ($BUILD)" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          done
          SIZE=$(stat -f%z BURN-IN-Remote.ipa)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/phone-latest/BURN-IN-Remote.ipa"
          cd "$GITHUB_WORKSPACE"
          python3 installer/altstore_source.py "$GITHUB_REPOSITORY" "$TAG" "$URL" "$SIZE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/altstore.json
          git commit -m "phone: AltStore source for $TAG" || exit 0
          git push
