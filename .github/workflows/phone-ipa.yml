# Builds Ashvane for iPhone (.ipa) and Android (.apk) on free GitHub runners.
#
# Apple's toolchain only runs on macOS, so the iOS build uses a macOS runner; Android builds on
# Linux. The .ipa is unsigned on purpose: your sideloader (AltStore, SideStore, Feather,
# Sideloadly, ESign, TrollStore) signs it with your own Apple ID. The .apk installs directly.
#
# Every run stamps the app as 1.0.<run number>, so each build is a real upgrade and the sideload
# feed matches the binary exactly - AltStore refuses to install when those two disagree.
name: Phone app (.ipa + .apk)

on:
  workflow_dispatch:
  push:
    paths:
      - "phone/**"
      - ".github/workflows/phone-ipa.yml"

permissions:
  contents: write          # publish the builds as a release and commit the sideload feed

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  ios:
    needs: version
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stamp the version
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("app.json")
          d = json.loads(p.read_text())
          d["expo"]["version"] = os.environ["VERSION"]
          d["expo"]["ios"]["buildNumber"] = os.environ["RUN_NUMBER"]
          p.write_text(json.dumps(d, indent=2))
          print("version", d["expo"]["version"])
          PY
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: pod install
        working-directory: phone/ios

      - name: Build without code signing
        working-directory: phone/ios
        run: |
          SCHEME=$(ls -d *.xcodeproj | head -1 | sed 's/\.xcodeproj$//')
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "Building scheme $SCHEME in $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Wrap the app into an .ipa
        working-directory: phone/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app was produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Ashvane.ipa Payload
          ls -lh Ashvane.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ashvane-ipa
          path: phone/ios/Ashvane.ipa
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp the version
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("app.json")
          d = json.loads(p.read_text())
          d["expo"]["version"] = os.environ["VERSION"]
          d["expo"]["android"]["versionCode"] = int(os.environ["RUN_NUMBER"])
          p.write_text(json.dumps(d, indent=2))
          PY
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build the APK
        working-directory: phone/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect the APK
        working-directory: phone/android
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK" || { echo "no apk produced"; exit 1; }
          cp "$APK" ../Ashvane.apk
          ls -lh ../Ashvane.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ashvane-apk
          path: phone/Ashvane.apk
          if-no-files-found: error

  publish:
    # Waits for Android too. It used to wait only for iOS, so on a run where Android was the
    # slower of the two - which is most runs - publishing finished first and the release went
    # out with no .apk at all. `always()` keeps the iPhone build publishable on its own when
    # Android fails, which is what the "missing if Android failed" line below expects.
    needs: [version, ios, android]
    if: |
      always() && github.ref == 'refs/heads/main'
      && needs.version.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Release both builds and refresh the sideload feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IPA=$(find builds -name "*.ipa" | head -1)
          APK=$(find builds -name "*.apk" | head -1)      # missing if Android failed
          test -n "$IPA" || { echo "no .ipa to publish"; exit 1; }
          NOTES="iPhone: unsigned on purpose - your sideloader signs it with your own Apple ID (AltStore, SideStore, Feather, Sideloadly, ESign, TrollStore). Android: install the .apk directly."
          for TAG in "phone-v$VERSION" "phone-latest"; do
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            # prerelease: the desktop updater reads /releases/latest and needs the installer there
            gh release create "$TAG" "$IPA" $APK --prerelease \
              --title "Ashvane $VERSION" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          done
          SIZE=$(stat -c%s "$IPA")
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/phone-latest/Ashvane.ipa"
          python3 installer/altstore_source.py "$GITHUB_REPOSITORY" "phone-v$VERSION" "$URL" "$SIZE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "phone: sideload feed for $VERSION" || exit 0
          git push
